<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Cassandra">
  <title>Cassandra</title>
  <defs>
    <linearGradient id="cassandra-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="cassandra-iris" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#4338ca"/>
    </radialGradient>
    <radialGradient id="cassandra-alert" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f87171" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#cassandra-bg)"/>

  <!-- The eye: Cassandra foresees what is coming. -->
  <path d="M60 256C124 136 388 136 452 256C388 376 124 376 60 256Z"
        fill="#0b1229" stroke="#e2e8f0" stroke-width="22" stroke-linejoin="round"/>
  <circle cx="256" cy="256" r="80" fill="url(#cassandra-iris)"/>

  <!-- The iris is a dependency graph with one vulnerable node. -->
  <g stroke="#e0f2fe" stroke-width="9" stroke-linecap="round">
    <line x1="222" y1="230" x2="292" y2="244"/>
    <line x1="222" y1="230" x2="238" y2="294"/>
    <line x1="238" y1="294" x2="292" y2="244"/>
  </g>
  <circle cx="222" cy="230" r="17" fill="#f8fafc"/>
  <circle cx="238" cy="294" r="17" fill="#f8fafc"/>
  <circle cx="292" cy="244" r="44" fill="url(#cassandra-alert)"/>
  <circle cx="292" cy="244" r="21" fill="#ef4444" stroke="#fee2e2" stroke-width="7"/>
</svg>
