name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: web
      - run: make test
      - run: npm run build
        working-directory: web
      - name: Validate packaging script
        run: bash -n scripts/release.sh
      - name: Build release archives without publishing
        env:
          TMPDIR: ${{ runner.temp }}
        run: bash scripts/release.sh v0.0.0 dist
      - name: Check release contents
        run: python3 scripts/verify_release.py dist
      - name: Exercise the packaged Linux CLI
        shell: bash
        env:
          PACKAGE_DIR: ${{ runner.temp }}/cassandra-package
        run: |
          (cd dist && sha256sum --check checksums.txt)
          mkdir -p "$PACKAGE_DIR"
          tar -xzf dist/cassandra_v0.0.0_linux_amd64.tar.gz -C "$PACKAGE_DIR"
          "$PACKAGE_DIR/cassandra" --version
          "$PACKAGE_DIR/cassandra" scan --help
          python3 scripts/smoke_scan.py "$PACKAGE_DIR/cassandra"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cassandra-cli-validation
          path: dist/
          if-no-files-found: error
          retention-days: 7
